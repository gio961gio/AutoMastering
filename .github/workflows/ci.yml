name: CI - Build & Test Suite

on:
  push:
    branches: [ master, sprint-2.2-audit-remediation ]
  pull_request:
    branches: [ master ]

jobs:
  test-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip list

      - name: Build C++ pybind11 extension inplace
        run: |
          python setup.py build_ext --inplace

      - name: Fetch JUCE 8 for C++ Plugin Headless Build
        run: |
          git clone --depth 1 --branch 8.0.6 https://github.com/juce-framework/JUCE.git C:/JUCE

      - name: Configure and Build JUCE plugin headless tests
        run: |
          cmake -B build_juce -DJUCE_DIR=C:/JUCE -DCMAKE_BUILD_TYPE=Release
          cmake --build build_juce --target plugin_headless_tests --config Release

      - name: Run JUCE C++ Headless Test Suite
        run: |
          $exe = if (Test-Path "build_juce/Release/plugin_headless_tests.exe") { "build_juce/Release/plugin_headless_tests.exe" } else { "build_juce/plugin_headless_tests.exe" }
          & $exe

      - name: Verify package imports
        env:
          PYTHONPATH: .${{ runner.os == 'Windows' && ';' || ':' }}python
        run: |
          python -c "from scripts.run_mastering import find_highest_energy_window; print('import ok')"
          python -c "import ddsp_mastering; print('package import ok')"

      - name: Run Pytest full test suite
        env:
          PYTHONPATH: .${{ runner.os == 'Windows' && ';' || ':' }}python
        run: |
          pytest python/tests/ -v --durations=10
